<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shipping Pickup Station - Scan Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-display">
  <!-- Minimal Header Bar -->
  <header class="top-bar">
    <div class="brand">
      <span class="pulse-indicator"></span>
      <span class="station-name">SHIPPING PICKUP STATION</span>
    </div>

    <!-- Active Input Bar (Keeps 100% focus) -->
    <div class="scan-bar-container">
      <input 
        type="text" 
        id="barcodeInput" 
        placeholder="Scan label..." 
        autocomplete="off" 
        autofocus 
        spellcheck="false"
      />
      <span class="scan-status-pill" id="timerBadge">READY</span>
    </div>

    <div class="top-controls">
      <button id="soundToggleBtn" class="pill-btn" title="Toggle audio alert">🔊 SOUND ON</button>
      <button id="historyToggleBtn" class="pill-btn" title="Toggle scan log drawer">📋 LOG (<span id="statCount">0</span>)</button>
      <button id="fullscreenBtn" class="pill-btn" title="Toggle Fullscreen">⛶ FULLSCREEN</button>
    </div>
  </header>

  <!-- HUGE BILLBOARD MONITOR DISPLAY -->
  <main class="billboard-container" id="billboardScreen">
    <div class="display-card idle" id="displayCard">
      <!-- 1. Top Status Badge -->
      <div class="sign-status" id="signStatus">
        <span class="status-icon" id="statusIcon">⚡</span>
        <span class="status-text" id="statusText">READY TO SCAN</span>
      </div>

      <!-- 2. Sub-header (SCANNED & VERIFIED) -->
      <div class="sign-subheading" id="signSubheading">
        AWAITING PACKAGE LABEL
      </div>

      <!-- 3. GIGANTIC PICKUP ROUTING LOCATION / CARRIER -->
      <div class="sign-destination" id="signDestination">
        SCAN BARCODE
      </div>

      <!-- Optional secondary lane / note (e.g. "or FedEx Ground") -->
      <div class="sign-subdest" id="signSubdest"></div>

      <!-- 4. Barcode number (Monospace, clear) -->
      <div class="sign-barcode" id="signBarcode">
        READY FOR SCANNER
      </div>
    </div>
  </main>

  <!-- Drawer for Scan Log & Review (Slide-in) -->
  <aside class="log-drawer" id="logDrawer">
    <div class="drawer-header">
      <h3>Scan History Log</h3>
      <div class="drawer-btns">
        <button id="exportCsvBtn" class="pill-btn sm">Export CSV</button>
        <button id="clearLogBtn" class="pill-btn sm danger">Clear</button>
        <button id="closeDrawerBtn" class="pill-btn sm">✕</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="history-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Barcode</th>
            <th>Pickup Destination / Carrier</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="scanHistoryBody">
          <!-- Log lines rendered here -->
        </tbody>
      </table>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
