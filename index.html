<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marathon Press - Shipping Pickup Verification</title>
  
  <!-- Web fonts for clean readable UI on warehouse monitors -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="app-body">

  <!-- =====================================================================
       HEADER / TOP BAR
       Contains station title, input box, and header action buttons.
       ===================================================================== -->
  <header class="app-header">
    <div class="brand-cluster">
      <div class="brand-badge">MP</div>
      <div class="brand-details">
        <span class="brand-title">MARATHON PRESS</span>
        <span class="brand-subtitle">Shipping Dispatch Console</span>
      </div>
    </div>

    <!-- 
      SCANNER INPUT BOX:
      Handheld USB/Bluetooth scanners transmit barcode numbers directly into this field.
    -->
    <div class="scanner-input-container">
      <div class="input-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path>
          <line x1="7" y1="12" x2="17" y2="12"></line>
        </svg>
      </div>
      <input 
        type="text" 
        id="barcodeInput" 
        placeholder="Ready to scan or paste barcode..." 
        autocomplete="off" 
        autofocus 
        spellcheck="false"
      />
      <button type="button" id="submitScanBtn" class="verify-btn">VERIFY</button>
      <span class="status-indicator-pill" id="scannerStatusBadge">READY</span>
    </div>

    <!-- Header action buttons -->
    <div class="header-actions">
      <button id="soundToggleBtn" type="button" class="action-btn" title="Toggle audio tone">Audio: On</button>
      <button id="historyToggleBtn" type="button" class="action-btn" title="Toggle scan history drawer">Log (<span id="statCount">0</span>)</button>
      <button id="fullscreenBtn" type="button" class="action-btn" title="Toggle fullscreen mode">Fullscreen</button>
    </div>
  </header>

  <!-- =====================================================================
       MAIN VERIFICATION BILLBOARD (The big screen display)
       `app.js` updates #displayCard with dynamic carrier color themes:
         - carrier-fedex-express (Vivid Orange)
         - carrier-fedex-ground  (Emerald Green)
         - carrier-ups           (UPS Gold)
         - carrier-usps          (Postal Blue)
         - carrier-dhl           (DHL Yellow)
         - carrier-upsmi         (Mail Innovations Purple)
         - carrier-internal      (Marathon Press Red)
       ===================================================================== -->
  <main class="terminal-stage">
    <section class="display-panel idle" id="displayCard">
      <!-- Status pill: Verified / Not Recognized -->
      <div class="badge-wrapper">
        <div class="status-pill" id="statusBadge">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-label" id="statusBadgeText">Ready to Scan</span>
        </div>
      </div>

      <!-- Giant carrier destination text -->
      <div class="carrier-display" id="signDestination">
        SCAN BARCODE
      </div>

      <!-- Secondary service line under carrier -->
      <div class="service-display" id="signSubdest">
        Awaiting package scan for pickup sorting
      </div>

      <!-- Scanned tracking number readout -->
      <div class="barcode-tag" id="signBarcode">
        WAITING FOR INPUT
      </div>
    </section>
  </main>

  <!-- =====================================================================
       SCAN HISTORY DRAWER
       Slides out from the right when clicking "Log" in the header.
       ===================================================================== -->
  <aside class="history-drawer" id="logDrawer">
    <div class="drawer-top">
      <div>
        <h3>Marathon Press Scan Log</h3>
        <p class="drawer-caption">Live Shift Scans & Verification History</p>
      </div>
      <div class="drawer-buttons">
        <button id="exportCsvBtn" type="button" class="drawer-btn">Export CSV</button>
        <button id="clearLogBtn" type="button" class="drawer-btn danger">Clear</button>
        <button id="closeDrawerBtn" type="button" class="drawer-btn close">✕</button>
      </div>
    </div>
    <div class="table-scroll">
      <table class="log-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Barcode</th>
            <th>Carrier</th>
            <th>Service</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="scanHistoryBody">
          <!-- JS fills this table in as packages get scanned -->
        </tbody>
      </table>
    </div>
  </aside>

  <!-- Main logic script -->
  <script src="app.js"></script>
</body>
</html>
