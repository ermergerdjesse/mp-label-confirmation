<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shipping Pickup Station - Scan Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-display">
  <!-- Minimal Top Header Bar (No Emojis) -->
  <header class="top-bar">
    <div class="brand">
      <span class="pulse-indicator"></span>
      <span class="station-name">SHIPPING PICKUP STATION</span>
    </div>

    <!-- Scanner Capture Field -->
    <div class="scan-bar-container">
      <input 
        type="text" 
        id="barcodeInput" 
        placeholder="Ready for barcode scan..." 
        autocomplete="off" 
        autofocus 
        spellcheck="false"
      />
      <span class="scan-status-pill" id="scannerStatusBadge">READY</span>
    </div>

    <div class="top-controls">
      <button id="soundToggleBtn" class="pill-btn" title="Toggle audio tone">AUDIO: ON</button>
      <button id="historyToggleBtn" class="pill-btn" title="Toggle scan log drawer">LOG (<span id="statCount">0</span>)</button>
      <button id="fullscreenBtn" class="pill-btn" title="Toggle Fullscreen">FULLSCREEN</button>
    </div>
  </header>

  <!-- GIGANTIC BILLBOARD SCREEN -->
  <main class="billboard-container" id="billboardScreen">
    <div class="display-card idle" id="displayCard">
      <!-- Top Status Badge -->
      <div class="sign-status" id="signStatus">
        <span class="status-badge-text" id="statusBadgeText">READY</span>
      </div>

      <!-- Verification Subheading -->
      <div class="sign-subheading" id="signSubheading">
        AWAITING PACKAGE SCAN
      </div>

      <!-- Giant Carrier Pickup Destination -->
      <div class="sign-destination" id="signDestination">
        SCAN BARCODE
      </div>

      <!-- Specific Service Sub-line (e.g. Ground / Priority / Express) -->
      <div class="sign-subdest" id="signSubdest"></div>

      <!-- High-contrast Monospace Barcode Number -->
      <div class="sign-barcode" id="signBarcode">
        READY
      </div>
    </div>
  </main>

  <!-- Slide-in Audit Log Drawer -->
  <aside class="log-drawer" id="logDrawer">
    <div class="drawer-header">
      <h3>Scan History Log</h3>
      <div class="drawer-btns">
        <button id="exportCsvBtn" class="pill-btn sm">EXPORT CSV</button>
        <button id="clearLogBtn" class="pill-btn sm danger">CLEAR</button>
        <button id="closeDrawerBtn" class="pill-btn sm">CLOSE</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="history-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Barcode</th>
            <th>Carrier / Destination</th>
            <th>Service Type</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="scanHistoryBody">
          <!-- Dynamically populated via app.js -->
        </tbody>
      </table>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
